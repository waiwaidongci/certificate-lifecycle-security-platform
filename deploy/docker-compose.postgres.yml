services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: certpilot
      POSTGRES_PASSWORD: certpilot
      POSTGRES_DB: certpilot
    ports:
      - "5432:5432"
    volumes:
      - certpilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certpilot -d certpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      CERTPILOT_DATABASE_DRIVER: postgres
      CERTPILOT_DATABASE_DSN: postgres://certpilot:certpilot@postgres:5432/certpilot?sslmode=disable
      CERTPILOT_SERVER_ADDRESS: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  certpilot-pgdata:
